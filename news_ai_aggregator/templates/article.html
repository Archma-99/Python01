<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">News AI Aggregator</a>
      </div>
    </nav>
    <main class="container mt-4">
      <div class="card">
        {% if image_url %}
          <img src="{{ image_url }}" class="card-img-top" alt="Article image">
        {% endif %}
        <div class="card-header">
          <h2>{{ title }}</h2>
        </div>
        <div class="card-body">
          <h5 class="card-title">AI-Generated Summary</h5>
          <p class="card-text" style="white-space: pre-wrap;">{{ summary }}</p>
        </div>
        <div class="card-footer">
            <a href="{{ url_for('index') }}" class="btn btn-primary">&larr; Back to Headlines</a>
        </div>
      </div>
    </main>
    <footer class="text-center text-muted py-4">
        <p>Powered by Flask, Newspaper3k, and Google Gemini.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
